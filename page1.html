<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字迷宫 · 解密</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d12;
    color: #d8d8e0;
    font-family: "Courier New", Consolas, monospace;
    padding: 40px 20px 80px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 30px; }
  header h1 {
    font-size: 26px;
    letter-spacing: 6px;
    color: #e8e8f0;
    margin-bottom: 12px;
  }
  header p { color: #8a8a99; font-size: 14px; letter-spacing: 1px; line-height: 1.8; }
  .tip {
    background: #1a1a24;
    border: 1px solid #2a2a35;
    border-left: 3px solid #c9a227;
    padding: 14px 18px;
    margin: 20px 0 28px;
    font-size: 14px;
    color: #b8b8c8;
    line-height: 1.9;
  }
  .tip b { color: #e8c96a; }
  .field {
    background: #12121a;
    border: 1px solid #2a2a35;
    border-radius: 8px;
    padding: 28px 24px;
    font-size: 18px;
    line-height: 2.1;
    word-break: break-all;
    letter-spacing: 1px;
    user-select: text;
  }
  .hl {
    color: #e8e8f0;
    font-weight: bold;
    text-shadow: 0 0 6px rgba(255,255,255,0.55), 0 0 12px rgba(255,255,255,0.25);
  }
  .footer { text-align: center; margin-top: 30px; color: #6a6a78; font-size: 13px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>数 字 迷 宫</h1>
    <p>五百个数字与字母之中，散落着一些被点亮的光。</p>
  </header>

  <div class="tip">
    提示：字符中散落着一些<b>加粗发光</b>的数字。按<b>从左到右、从上到下</b>的顺序将它们收集起来，<br>
    每 <b>三位</b> 一组转成 ASCII 码（不足三位补零），你将得到通往终点的地址。
  </div>

  <div class="field" id="field"></div>

  <div class="footer">—— 光会指引你 ——</div>
</div>

<script>
  // 目标链接：page2.html → ASCII 编码（每位补零至 3 位）
  // p=112 a=097 g=103 e=101 2=050 .=046 h=104 t=116 m=109 l=108
  const SECRET = "112097103101050046104116109108";
  const TOTAL = 500;

  // 随机字符池：大小写英文 + 数字
  const pool = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  function randChar() {
    return pool.charAt(Math.floor(Math.random() * pool.length));
  }

  // 生成 500 个随机字符
  let chars = [];
  for (let i = 0; i < TOTAL; i++) chars.push(randChar());

  // 随机挑选 SECRET.length 个互不重复的位置，排序后按顺序填入密码数字
  // 这样按阅读顺序收集即可还原密码
  const positions = new Set();
  while (positions.size < SECRET.length) {
    positions.add(Math.floor(Math.random() * TOTAL));
  }
  const sortedPos = Array.from(positions).sort(function(a, b) { return a - b; });
  for (let i = 0; i < SECRET.length; i++) {
    chars[sortedPos[i]] = SECRET.charAt(i);
  }

  // 渲染：密码数字加粗发光，其余字符正常显示
  const field = document.getElementById('field');
  const hlSet = new Set(sortedPos);
  let html = "";
  for (let i = 0; i < TOTAL; i++) {
    if (hlSet.has(i)) {
      html += '<span class="hl">' + chars[i] + '</span>';
    } else {
      html += chars[i];
    }
  }
  field.innerHTML = html;
</script>
</body>
</html>
