<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字迷宫 · 解密</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d12;
    color: #d8d8e0;
    font-family: "Courier New", Consolas, monospace;
    padding: 40px 20px 80px;
  }
  .container { max-width: 820px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 30px; }
  header h1 {
    font-size: 26px;
    letter-spacing: 6px;
    color: #e8e8f0;
    margin-bottom: 12px;
  }
  header p { color: #8a8a99; font-size: 14px; letter-spacing: 1px; line-height: 1.8; }
  .tip {
    background: #1a1a24;
    border: 1px solid #2a2a35;
    border-left: 3px solid #c9a227;
    padding: 14px 18px;
    margin: 20px 0 28px;
    font-size: 14px;
    color: #b8b8c8;
    line-height: 1.9;
  }
  .tip b { color: #e8c96a; }
  .field {
    background: #12121a;
    border: 1px solid #2a2a35;
    border-radius: 8px;
    padding: 28px 24px;
    font-size: 18px;
    line-height: 2.1;
    word-break: break-all;
    letter-spacing: 1px;
    user-select: text;
  }
  .hl {
    color: #0d0d12;
    background: #e8c96a;
    padding: 1px 4px;
    border-radius: 3px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(232,201,106,0.5);
    transition: all 0.25s ease;
  }
  .hl:hover { background: #f5dd8a; box-shadow: 0 0 18px rgba(232,201,106,0.8); }
  .footer { text-align: center; margin-top: 30px; color: #6a6a78; font-size: 13px; letter-spacing: 1px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>数 字 迷 宫</h1>
    <p>五百个数字与字母之中，藏着一串被点亮的光。</p>
  </header>

  <div class="tip">
    提示：被高亮的那一串数字，每 <b>三位</b> 对应一个字符（ASCII 码，不足三位补零）。<br>
    解码它，你将得到通往终点的地址。也可以直接点击那串高亮数字。
  </div>

  <div class="field" id="field"></div>

  <div class="footer">—— 光会指引你 ——</div>
</div>

<script>
  // 目标链接：page2.html → ASCII 编码（每位补零至 3 位）
  // p=112 a=097 g=103 e=101 2=050 .=046 h=104 t=116 m=109 l=108
  const SECRET = "112097103101050046104116109108";
  const TOTAL = 500;

  // 随机字符池：大小写英文 + 数字
  const pool = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";

  function randChar() {
    return pool.charAt(Math.floor(Math.random() * pool.length));
  }

  // 生成 500 个字符，把高亮数字串插入随机位置
  let chars = [];
  for (let i = 0; i < TOTAL; i++) chars.push(randChar());

  const pos = Math.floor(Math.random() * (TOTAL - SECRET.length));
  for (let i = 0; i < SECRET.length; i++) {
    chars[pos + i] = SECRET.charAt(i);
  }

  // 渲染：高亮数字串用特殊样式，其余字符正常显示
  const field = document.getElementById('field');
  let html = "";
  for (let i = 0; i < TOTAL; i++) {
    if (i >= pos && i < pos + SECRET.length) {
      html += '<span class="hl" title="点击前往终点" onclick="location.href=\'page2.html\'">' + chars[i] + '</span>';
    } else {
      html += chars[i];
    }
  }
  field.innerHTML = html;
</script>
</body>
</html>
