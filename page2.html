<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>终点 · 解密</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d12;
    color: #d8d8e0;
    font-family: "Songti SC", "SimSun", "Noto Serif SC", serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }
  .img-wrap {
    max-width: 90vw;
    max-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .img-wrap img {
    max-width: 100%;
    max-height: 70vh;
    border: 1px solid #2a2a35;
    border-radius: 6px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    cursor: pointer;
    transition: transform 0.25s ease;
  }
  .img-wrap img:hover { transform: scale(1.01); }
  .caption {
    margin-top: 36px;
    font-size: 20px;
    letter-spacing: 3px;
    color: #e8e8f0;
    text-align: center;
    line-height: 2;
  }
  .download {
    margin-top: 20px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #8a8a99;
  }
  .download a {
    color: #c9a227;
    text-decoration: none;
    border-bottom: 1px dashed #c9a227;
    padding-bottom: 2px;
  }
  .download a:hover { color: #e8c96a; }
</style>
</head>
<body>
  <div class="img-wrap">
    <a href="image.png" download="image.png" title="点击下载原图">
      <img src="image.png" alt="黑白图片">
    </a>
  </div>
  <div class="caption">【这是一个有关于恨、背叛、与爱的故事。】</div>
  <div class="download"><a href="image.png" download="image.png">下载原图</a></div>
</body>
</html>
